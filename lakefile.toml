name = "Meridian"
version = "0.1.0"
keywords = ["metaprogramming", "proof-search", "tactics"]
defaultTargets = ["Meridian"]

[leanOptions]
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
path = "../mathlib4-fork-stable"
# Shared mathlib worktree (v4.31.0-rc1). See feedback_lean_caches_symlink_convention
# in ~/.claude memory for the rationale.

[[lean_lib]]
name = "Meridian"

# `lake exe export-meridian <out.ttl> [Module1 Module2 ...]` produces a v0.2
# Meridian Turtle dump of the imported environment. Stratum's `cite
# lean-sync` driver invokes this against any Meridian-importing Lean project
# to feed `stratum-meridian-bridge`. The exe's `main` lives in
# `Meridian/Drivers/ExportMain.lean`; `supportInterpreter = true` is required
# because the driver runs Lean's environment loader at runtime
# (mirrors `importGraph`'s `lake exe graph` setup).
[[lean_exe]]
name = "export-meridian"
root = "Meridian.Drivers.ExportMain"
supportInterpreter = true

# `lake exe lean-goal-at <SourceFile.lean> <line> <col>` re-elaborates the
# given file and prints the primary tactic goal's type at the position in
# `Expr.dbgToString` debug form (the same lexical space as the exporter's
# `mer:typeSignature`). Phase 2 Task 13 of the lean-suggest plan; the Rust
# wiring (Task 14) shells out to this binary. `supportInterpreter = true`
# because the driver runs Lean's frontend (header import + command
# elaboration) at runtime.
[[lean_exe]]
name = "lean-goal-at"
root = "Meridian.Drivers.GoalAt"
supportInterpreter = true

[[lean_lib]]
name = "TestCore"
srcDir = "test"
globs = ["Core.TestSorryExtract", "Core.TestDepGraph", "Core.TestInventory", "Core.TestTheoremExtract", "Core.TestVerify", "Core.TestTransform", "Core.TestDisprove", "Core.TestExportRdf"]
